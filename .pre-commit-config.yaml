# Run with: `pre-commit run --all-files` (or install with `pre-commit install`).
# CI runs this via `.github/workflows/pre-commit.yaml` regardless of whether
# contributors have pre-commit installed locally. The existing `.hooks/pre-commit`
# handles staged-file formatting via lint-staged on every commit; this config
# adds wider hygiene checks (shellcheck, large-file detection, JSON/YAML
# validity, etc.) that aren't covered there.

# Pin the Python interpreter used by all Python-based hooks so local runs and
# CI produce identical environments. Must match the python-version in
# .github/workflows/pre-commit.yaml and the .python-version file.
default_language_version:
  python: python3.11

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      # A committed `.patch`/`.diff` is exempt from every hook that rewrites
      # bytes. A unified diff's context line for a BLANK line is a lone space,
      # so stripping it makes `git apply` answer `corrupt patch`; appending a
      # newline or rewriting line endings breaks the same file the same way.
      - id: trailing-whitespace
        exclude: ^(pnpm-lock\.yaml|.*\.(patch|diff))$
      - id: end-of-file-fixer
        exclude: ^(pnpm-lock\.yaml|.*\.(patch|diff))$
      - id: check-yaml
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: check-executables-have-shebangs
      - id: check-shebang-scripts-are-executable
      - id: check-case-conflict
      - id: check-symlinks
      - id: mixed-line-ending
        args: [--fix=lf]
        exclude: ^.*\.(patch|diff)$

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck
        # Enable one optional check beyond the defaults: require [[ ]] over
        # [ ] in bash/ksh.
        # -P lists the directories a `source`/`.` line is resolved against, so a
        # script that sources a sibling library is followed instead of reported
        # SC1091 "not following".
        args:
          [-x, -P, ".claude/hooks:.github/scripts", -o, require-double-brackets]

  - repo: https://github.com/scop/pre-commit-shfmt
    rev: v3.12.0-2
    hooks:
      - id: shfmt
        args: [-i, "2", -w]

  # Lints workflow/action correctness and runs shellcheck on inline `run:`
  # blocks that the standalone shellcheck hook can't see. Python-wrapped so it
  # needs no Go toolchain in the Python-only pre-commit CI job.
  - repo: https://github.com/Mateusz-Grzelinski/actionlint-py
    rev: v1.7.12.24
    hooks:
      - id: actionlint

  # Catches markdown that does not render as written — malformed tables, broken
  # link fragments, code spans that swallow their delimiters — plus the local
  # `orphan-table-row` rule (.github/scripts/markdownlint-orphan-table-row.mjs),
  # which reports a table row a blank line severed from its table: the parser
  # never accepted it as a row, so no stock rule inspects it. Prettier owns
  # whitespace/wrapping; every rule it touches is off in .markdownlint-cli2.jsonc
  # so the two never rewrite each other.
  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.23.1
    hooks:
      - id: markdownlint-cli2
        args: [--fix]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.5
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  # Fail on an internal Markdown link that points at a missing repo-relative
  # file (link rot from a moved or renamed target). `--offline` resolves only
  # local file links and skips every http(s)/mailto link, so the check is
  # deterministic and never flakes on a slow or unreachable external site.
  - repo: https://github.com/lycheeverse/lychee
    rev: lychee-v0.24.2
    hooks:
      - id: lychee
        args: [--offline, --no-progress]
        types: [markdown]

  # Honesty + identity CI lints: catch a green check that hides a failed
  # command (pipefail/|| true/2>/dev/null), a path-filtered required check that
  # hangs forever, or a mutable base-image/download pin. Tier 2 adds the
  # required-check-shape lints this template's workflows already follow
  # (classified always() reporters, explicit concurrency, externalized run
  # blocks). Extras adds check-claude-model (explicit --model on the
  # claude-code-action steps this template ships) plus the unnamed-regex-group
  # and global-stdio-swap Python lints. Tier aggregates over per-check ids so a
  # check added upstream to a tier applies here with no config change.
  - repo: https://github.com/AlexanderMattTurner/ci-truth-serum
    rev: 01aa20655323f8ce5a5b8554556dd9dbeeedc232 # ci-truth-serum main, past #169
    hooks:
      - id: check-tier1
      # check-path-gate-deps and check-failure-notifier-coverage are Tier 2
      # members but are listed explicitly below, so skip them here to avoid
      # running each twice.
      - id: check-tier2
        args:
          # BEGIN GENERATED: check-tier2 skips (.github/scripts/gen_cts_tier_skips.py) — do not edit by hand
          - --skip
          - check_path_gate_deps
          - --skip
          - check_failure_notifier_coverage
          # END GENERATED: check-tier2 skips
      - id: check-extras
      # A gated job whose decide filters omit a composite/script dependency fails
      # open — the job skips exactly when that dependency changes and the reporter
      # goes green.
      - id: check-path-gate-deps
      # The notifier's workflow_run list is a derived copy of the tree's
      # push/schedule workflows; --require-notifier fails loud if this repo's
      # ci-failure-notify.yaml is ever deleted or its list drifts.
      # Fails closed by default when no notifier workflow is discoverable — the
      # explicit opt-in this repo used to need (--require-notifier) is now the
      # check's own default; --allow-no-notifier is the escape hatch, unused here.
      - id: check-failure-notifier-coverage
      # The enforced form of a "keep these in lockstep" comment: each --pair
      # extracts one value from two files and fails unless they are equal, and a
      # regex matching zero or several times is a hard error rather than a pass.
      # Config-driven, so it sits outside every tier aggregate. An N-file family
      # needs N-1 pairs, chained — pairwise equality along the chain is what makes
      # the whole family agree.
      - id: check-lockstep-pins
        args:
          - --pair # ruff: the session hook installs it, pre-commit pins the rev
          - .claude/hooks/session-setup.sh
          - 'uv_install_if_missing\s+ruff\s+"ruff==([^"]+)"'
          - .pre-commit-config.yaml
          - 'astral-sh/ruff-pre-commit\s*\n\s*rev:\s*v?(\S+)'
          - --pair # zizmor: session hook ↔ pre-commit
          - .claude/hooks/session-setup.sh
          - 'uv_install_if_missing\s+zizmor\s+"zizmor==([^"]+)"'
          - .pre-commit-config.yaml
          - 'additional_dependencies: \["zizmor==([^"]+)"\]'
          - --pair # zizmor: pre-commit ↔ the required check that runs it with network
          - .pre-commit-config.yaml
          - 'additional_dependencies: \["zizmor==([^"]+)"\]'
          - .github/workflows/zizmor.yaml
          - 'uvx zizmor==(\S+)'
          - --pair # python: the interpreter pre-commit's Python hooks bind to
          - .python-version
          - '(\S+)'
          - .pre-commit-config.yaml
          - 'python:\s*python(\S+)'
          - --pair # python: pre-commit ↔ the CI job that must provide that interpreter
          - .pre-commit-config.yaml
          - 'python:\s*python(\S+)'
          - .github/workflows/pre-commit.yaml
          - 'python-version:\s*"?(\S+?)"?\s*$'
          - --pair # ci-truth-serum: the lints here ↔ the ruleset apply tool
          - .pre-commit-config.yaml
          - 'AlexanderMattTurner/ci-truth-serum\s*\n\s*rev:\s*(\S+)'
          - .github/workflows/sync-required-checks.yaml
          - 'ci-truth-serum @ git\+https://github\.com/AlexanderMattTurner/ci-truth-serum@(\S+)"'

  - repo: local
    hooks:
      # An aggregate runs every member of its tier, so a member this config also
      # lists on its own runs twice unless the aggregate skips it. That skip list
      # is derived from two facts neither of which this list may restate: the hook
      # ids above, and which tier owns each member (read from `run_tier.TIERS` in
      # the ci-truth-serum clone pre-commit made for the `rev:` above). pre-commit
      # reads `args` inline and cannot compute them, which is what makes a
      # generated region the right shape here.
      - id: gen-cts-tier-skips
        name: regenerate the ci-truth-serum tier --skip lists from the hooks listed here
        # No `git add`: a hook that stages its own output hides the rewrite from
        # the commit the author reviewed.
        entry: python .github/scripts/gen_cts_tier_skips.py
        # language: python (not system) so PyYAML is installed by pre-commit
        # itself, on any machine and in CI.
        language: python
        additional_dependencies: ["pyyaml==6.0.3"]
        pass_filenames: false
        files: ^(\.github/scripts/gen_cts_tier_skips\.py|\.pre\-commit\-config\.yaml|scripts/lib_marked_region\.py)$

      # `workflow_run` has no wildcard and GitHub resolves the list statically
      # from the default branch, so the notifier's watched-name list cannot be
      # derived at run time. This hook derives it from the tree instead;
      # check-failure-notifier-coverage still holds the committed region to the
      # lint's own predicate.
      - id: gen-failure-notify-listener
        name: regenerate the ci-failure-notify watched-workflow list from the tree
        # No `git add`, for the reason above.
        entry: python .github/scripts/gen_failure_notify_listener.py
        language: python
        additional_dependencies: ["pyyaml==6.0.3"]
        pass_filenames: false
        files: ^(\.github/scripts/gen_failure_notify_listener\.py|\.github/workflows/.*\.ya?ml|scripts/lib_marked_region\.py)$

      - id: zizmor
        name: zizmor (GitHub Actions security audit)
        entry: zizmor
        language: python
        additional_dependencies: ["zizmor==1.25.2"]
        pass_filenames: false
        # --offline: the `known-vulnerable-actions` audit queries
        # api.github.com/advisories, which a sandboxed or repo-scoped session
        # cannot reach — and zizmor aborts the WHOLE run on that error ("fatal:
        # no audit was performed"), so one unreachable endpoint takes every
        # other audit down with it and blocks the commit. Offline keeps the
        # local run useful. The advisory audit still runs, with network, in
        # .github/workflows/zizmor.yaml — a required check, so it is not lost.
        args: ["--offline", ".github/"]
        files: ^\.github/

      # The template's JS propagates into consumers who point `eslint .` at their
      # whole tree, so template-owned files that violate a common rule set break
      # THEIR lint — and, where a release gates on it, their publish. Lint the
      # propagated files here under that rule set (eslint.config.mjs) so the
      # breakage lands on the template's own PR instead of downstream.
      - id: eslint-propagated-js
        name: eslint (files the template propagates)
        entry: pnpm lint:js
        language: system
        pass_filenames: false
        files: ^(\.claude/.*|\.github/scripts/.*|tests/.*|eslint\.config)\.(js|mjs|cjs)$

      - id: validate-config
        name: validate Claude hook configuration
        entry: bash .github/scripts/validate-config.sh
        language: system
        pass_filenames: false
        files: ^(\.claude/|\.hooks/|\.github/workflows/)

      - id: lint-skills
        name: lint Claude SKILL.md files
        entry: bash .hooks/lint-skills.sh
        language: system
        files: ^\.claude/skills/.*\.md$

      # Depth-based parent-walking silently breaks when a test file moves;
      # tests must take REPO_ROOT from tests/_helpers.py (git rev-parse).
      - id: check-test-repo-root
        name: forbid Path(__file__) parent-walking for repo root in tests
        entry: python3 .github/scripts/check-test-repo-root.py
        language: system
        files: ^tests/.*\.py$

      - id: check-pipefail-sigpipe
        # Under `set -o pipefail` a consumer that stops reading mid-stream
        # (`head -N`, `grep -q`, `sed '5q'`) SIGPIPEs its still-writing producer,
        # so the pipeline exits 141 and `set -e` aborts the script — on exactly
        # the large inputs the cap exists for. Timing-dependent: it hides on a
        # fast machine and bites on a slow CI runner.
        name: no early-exiting pipe consumer under `set -o pipefail`
        entry: python .github/scripts/check-pipefail-sigpipe.py
        # language: python (not system) so the bash AST parser this lint needs
        # is installed by pre-commit itself, on any machine and in CI — `python`
        # resolves to that env's interpreter.
        language: python
        additional_dependencies:
          ["tree-sitter==0.26.0", "tree-sitter-bash==0.25.1"]
        files: '(\.(sh|bash)$|^\.hooks/[^/]+$)'

      - id: check-hook-timeouts
        # Every PreToolUse hook entry must declare an explicit timeout — a reaped
        # PreToolUse hook is NON-blocking, so the guarded tool runs unchecked.
        name: require an explicit timeout on every PreToolUse hook (else fail open)
        entry: python3 .github/scripts/check-hook-timeouts.py
        language: system
        pass_filenames: false
        always_run: true

      - id: check-hook-stdin-guarded
        # A readStdinJson() inside a hook's isMain block must be in a try (or route
        # through runJudgeCli) — an unhandled stdin-parse rejection exits non-zero,
        # which is non-blocking, so the guardrail is silently lost (fail open).
        name: readStdinJson() in a hook isMain block must be try-guarded
        entry: python3 .github/scripts/check-hook-stdin-guarded.py
        language: system
        files: '^\.claude/hooks/.*\.mjs$'
        exclude: '\.test\.mjs$'

      - id: check-proto-pollution
        # Flags a plain object literal (`{}`) later written with a computed
        # non-literal key (`x[k] = …`): an untrusted key like `__proto__` routes
        # through the prototype chain — the field vanishes and Object.prototype
        # can be poisoned. Real TS AST walk (typescript is a dev dep), so
        # strings/comments never masquerade as writes; safe shapes
        # (Object.create(null), Map, defineProperty) pass. Scans .claude/hooks +
        # .github/scripts; per-line `// proto-pollution-ok: <reason>` opt-out.
        name: no computed-key write to a plain object (prototype pollution)
        entry: node .github/scripts/check-proto-pollution.mjs
        language: system
        pass_filenames: false
        always_run: true

      # The checks below live in .github/scripts/checks/ and are ported from
      # agent-resolve-merge-conflicts, which took them from agent-glovebox. Each
      # one blocks a failure mode this tree already had the shape for; the
      # ported script's docstring names what it simplified.
      - id: cwd-scoped-git
        # Blocks a subprocess git argv that names no repository (no `-C`, no
        # `cwd=`) — in-process, that acts on whatever directory the caller sits in.
        name: every subprocess git call names its repository
        entry: python3 .github/scripts/checks/cwd-scoped-git.py
        language: system
        files: \.py$
        exclude: ^\.venv/

      - id: dead-shell-functions
        # Blocks a shell function with no caller outside tests/ — an assumption
        # that rots unseen.
        name: no shell function without a caller
        entry: python3 .github/scripts/checks/dead-shell-functions.py
        language: system
        pass_filenames: false

      - id: shell-source-declarations
        # Blocks a `source`/`.` statement shellcheck cannot follow (no directive,
        # or a directive naming a path the tree lacks) — a real bug in the
        # sourced file then goes unchecked.
        name: every `source` line is followable by shellcheck
        entry: python3 .github/scripts/checks/shell-source-declarations.py
        language: system
        files: \.(sh|bash)$|^\.hooks/[^.]+$|^\.claude/hooks/[^.]+$

      - id: bare-mkdir
        # Blocks `mkdir -p` with no post-condition check — exits 0 on BSD/macOS
        # even over a dangling symlink, so a later write dies cryptically.
        name: "`mkdir -p` checks the directory exists"
        entry: python3 .github/scripts/checks/bare-mkdir.py
        language: system
        files: \.(sh|bash)$|^\.hooks/[^.]+$|^\.claude/hooks/[^.]+$

      - id: env-arith
        # Blocks an ALL-CAPS (env-sourced) variable read unvalidated inside
        # `$(( ))` — a non-integer value aborts a `set -e` caller.
        name: validate an env value before arithmetic on it
        entry: python3 .github/scripts/checks/env-arith.py
        language: system
        files: \.(sh|bash)$|^\.hooks/[^.]+$|^\.claude/hooks/[^.]+$

      - id: curl-retry
        # Blocks a single-shot file-writing `curl -o` with no `--retry` — one
        # dropped packet fails the whole install.
        name: a downloading curl carries --retry
        entry: python .github/scripts/checks/curl-retry.py
        language: python
        additional_dependencies:
          ["tree-sitter==0.26.0", "tree-sitter-bash==0.25.1"]
        files: \.(sh|bash)$|^\.hooks/[^.]+$|^\.claude/hooks/[^.]+$

      - id: retry-loop
        # Blocks a new hand-rolled counted sleep-and-retry loop — this repo has
        # one retry primitive; a second copy drifts.
        name: no hand-rolled retry loop
        entry: python .github/scripts/checks/retry-loop.py
        language: python
        additional_dependencies:
          ["tree-sitter==0.26.0", "tree-sitter-bash==0.25.1"]
        files: \.(sh|bash)$|^\.hooks/[^.]+$|^\.claude/hooks/[^.]+$

      - id: unbounded-waits
        # Blocks a bare remote `git` (fetch/clone/push/pull/ls-remote) with no
        # `timeout` — a wedged endpoint hangs the tool forever.
        name: a remote git call is bounded by `timeout`
        entry: python .github/scripts/checks/unbounded-waits.py
        language: python
        additional_dependencies:
          ["tree-sitter==0.26.0", "tree-sitter-bash==0.25.1"]
        # `[^/]+` not `[^.]+`: .hooks holds lib-gate.sh and lint-skills.sh
        # beside the extensionless git hooks, and a dot-rejecting class drops them.
        files: ^\.claude/hooks/.*\.(sh|bash)$|^\.hooks/[^/]+$

      - id: positional-git-argv
        # Blocks a test that indexes git's argv by fixed position — a wrapper
        # that inserts global options shifts the subcommand and the stub goes
        # silently vacuous.
        name: no fixed-position index into git's argv in a test
        entry: python3 .github/scripts/checks/positional-git-argv.py
        language: system
        files: ^tests/.*\.py$

      - id: path-shadowed-interpreter
        # Blocks a bare `python3`/`python` in a workflow step downstream of an
        # agent step — claude-code-action rewrites PATH to the system interpreter.
        name: no bare python downstream of an agent step
        entry: python .github/scripts/checks/path-shadowed-interpreter.py
        language: python
        additional_dependencies: ["pyyaml==6.0.3"]
        files: ^\.github/workflows/.*\.ya?ml$
        pass_filenames: false

      - id: sleep-as-sync
        # Blocks a fixed `time.sleep(N)` used to synchronize with an event before
        # an assertion — flakes under load, passes silently if the event never
        # arrives.
        name: no fixed sleep used to synchronize a test
        entry: python3 .github/scripts/checks/sleep-as-sync.py
        language: system
        files: ^tests/.*\.py$

      - id: big-tuple-annotations
        # A positional tuple[str, int, bool] of 3+ fields has no names, so a
        # reordered pair is a silent bug no reviewer can see from the signature.
        name: forbid a 3+ element positional tuple[...] annotation
        entry: python3 .github/scripts/checks/big-tuple-annotations.py
        language: system
        files: '\.py$'
        exclude: "^tests/"

      - id: duplicate-module-constant
        # A module-level name assigned twice silently shadows the first binding —
        # an edit to the first copy is discarded with no error.
        name: forbid a module-level name assigned more than once
        entry: python3 .github/scripts/checks/duplicate-module-constant.py
        language: system
        files: '\.py$'

      - id: duplicate-class-names
        # The same top-level class name in two .github/scripts modules leaves
        # neither as the definition, so a call site reads one header and gets the
        # other's behaviour.
        name: forbid a class name defined in more than one .github/scripts module
        entry: python3 .github/scripts/checks/duplicate-class-names.py
        language: system
        pass_filenames: false
        always_run: true

      - id: test-helper-kwargs
        # pyright excludes tests/, so a test call whose helper's signature moved
        # underneath it gets no signature check until the suite runs and TypeErrors.
        name: match every tests/ call against its helper's real signature
        entry: python3 .github/scripts/checks/test-helper-kwargs.py
        language: system
        pass_filenames: false
        always_run: true

      - id: wall-clock-assertions
        # An assertion on a wall-clock delta measures the shared CI runner's
        # load, not the code, and flakes the day the box is busy.
        name: forbid a test assertion comparing a wall-clock delta to a number
        entry: python3 .github/scripts/checks/wall-clock-assertions.py
        language: system
        files: '(^tests/.*\.(py|mjs)$|\.test\.mjs$)'

      - id: unreset-module-state
        # Module state a function writes at runtime, with no _reset_process_state,
        # leaks between pytest-xdist tests sharing one worker process.
        name: require a reset for module-level state written at runtime
        entry: python3 .github/scripts/checks/unreset-module-state.py
        language: system
        files: '\.py$'

      - id: relative-imports
        # A relative import with no extension or naming a directory is
        # ERR_MODULE_NOT_FOUND at runtime — Node ESM guesses neither.
        name: require every relative .mjs import to resolve to a real file
        entry: node .github/scripts/checks/relative-imports.mjs
        language: system
        pass_filenames: false
        always_run: true

      - id: grant-wildcards
        # A `Bash(cmd*)` allow-grant's `*` extends the command word itself, so it
        # auto-approves any longer command sharing that prefix (`git diff*` also
        # approves `git difftool`, which runs an arbitrary git-config command).
        name: Bash allow-grant wildcard must not extend a word
        entry: python3 .github/scripts/checks/grant-wildcards.py
        language: system
        files: '^\.claude/settings.*\.json$'

      - id: truncating-pr-json
        # `gh pr view/list --json files/commits/comments/reviews` asks GitHub for a
        # connection capped at 100 with no cursor; past that gh exits 0 with a
        # silently short list, and a token/window decided from it is silently wrong.
        name: no `gh pr view/list --json` read of an uncursored 100-cap connection
        entry: python .github/scripts/checks/truncating-pr-json.py
        language: python
        additional_dependencies:
          ["tree-sitter==0.26.0", "tree-sitter-bash==0.25.1"]
        files: '(\.(sh|bash)$|^\.hooks/[^/]+$)'

      - id: gate-hooks-shimmed
        # A PreToolUse hook not wrapped in safe-launch.sh fails OPEN on a parse
        # error (Claude Code treats a crashed hook as non-blocking), so the tool
        # call it was meant to gate sails through unguarded.
        name: every settings hook invoked via safe-launch.sh
        entry: python3 .github/scripts/checks/gate-hooks-shimmed.py
        language: system
        pass_filenames: false
        always_run: true

      - id: sparse-checkout-closure
        # A workflow job's `sparse-checkout:` list that omits a path its own steps
        # `run:`/`uses: ./...` read dies with "No such file or directory" the first
        # time that step executes — hidden from every other check, since sparse
        # checkout hides the gap only from the runner, not from `git ls-files`.
        name: sparse-checkout list covers what the job reads
        entry: python .github/scripts/checks/sparse-checkout-closure.py
        language: python
        additional_dependencies: ["pyyaml==6.0.3"]
        pass_filenames: false
        files: '^\.github/workflows/.*\.ya?ml$'

      # The three ratchets below share config/<name>-baseline.json through
      # .github/scripts/checks/_ratchet.py. Each scans the WHOLE tree every run,
      # not just the staged files, because that is what makes a baseline entry
      # for a file the tree already fixed (or deleted) fail loud — so the
      # grandfathered list can only shrink.
      - id: file-size
        # A ratcheted source file that regrows past its baselined line count must
        # be lowered or the entry regenerated.
        name: file-size ratchet (config/file-size-baseline.json)
        entry: python3 .github/scripts/checks/file-size.py
        language: system
        pass_filenames: false
        always_run: true

      - id: comment-block-length
        # A comment/docstring block past code-style.md's 5-line note / 20-line
        # header cap hides a design document inside the code.
        name: comment-block-length ratchet (config/comment-block-length-baseline.json)
        entry: python .github/scripts/checks/comment-block-length.py
        # language: python (not system) so the bash AST parser this lint needs is
        # installed by pre-commit itself, on any machine and in CI.
        language: python
        additional_dependencies:
          ["tree-sitter==0.26.0", "tree-sitter-bash==0.25.1"]
        pass_filenames: false
        always_run: true

      - id: unspecified-encoding
        # A text-mode read_text()/write_text()/open() with no encoding= decodes
        # with the platform default, so a fixture holding an em-dash mis-decodes
        # only on some hosts.
