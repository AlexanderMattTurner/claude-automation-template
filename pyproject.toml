[project]
name = "claude-automation-template"
version = "0.0.0"
requires-python = ">=3.10"

[project.optional-dependencies]
# tree-sitter{,-bash}: the bash AST behind check-pipefail-sigpipe.py. Pinned to
# the same versions the pre-commit hook installs, so the test env and the
# enforced env agree on what the parser accepts.
dev = [
    "pytest>=7,<10",
    "pyyaml>=6,<7",
    "tree-sitter==0.26.0",
    "tree-sitter-bash==0.25.1",
]

[tool.ruff]
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "drift_guard(reason): justified drift-guard test — states why a true SSOT is infeasible (enforced by ci-truth-serum's check-drift-guards hook, via the check-extras aggregate in .pre-commit-config.yaml)",
]
