version: 2

# Only track a handful of npm packages for version updates.
# Security updates for all packages are handled separately by
# GitHub's Dependabot security alerts (enabled at the repo level).
#
# "Watch everything" generates weekly churn that maintainers tend to
# rubber-stamp, undermining the security goal. Default to security-only
# monitoring with explicit opt-in for packages you actively care about.

updates:
  - package-ecosystem: "github-actions"
    # "/" scans .github/workflows; the glob reaches the composite actions,
    # whose claude-code-action pin bundles the Claude CLI it runs.
    directories: ["/", "/.github/actions/*"]
    schedule:
      interval: "monthly"
    groups:
      github-actions:
        patterns:
          - "*"
    cooldown:
      default-days: 7

  # The Claude CLI pin that .github/scripts/install-claude-cli.sh installs.
  - package-ecosystem: "npm"
    directory: "/.github/claude-cli"
    schedule:
      interval: "weekly"
    allow:
      - dependency-name: "@anthropic-ai/claude-code"
    cooldown:
      default-days: 2 # zizmor: ignore[dependabot-cooldown] — Anthropic publishes this CLI, and a new model needs its release fast
