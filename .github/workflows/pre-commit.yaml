name: pre-commit

on:
  push:
    branches: ["main"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # setup-python provides the `python3.11` on PATH that pre-commit binds
      # every `language: python` hook to (default_language_version). uvx runs
      # pre-commit itself; the two versions are kept in sync by
      # tests/test_version_sync.py.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      # Node deps must be installed for the node-based `language: system` hooks:
      # check-proto-pollution does `import ts from "typescript"`, which resolves
      # from the repo's node_modules (ESM ignores NODE_PATH), so the module is
      # absent until `pnpm install` runs.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ".nvmrc"
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - name: Install node deps
        # No --frozen-lockfile: the repo gitignores pnpm-lock.yaml, so CI resolves
        # from package.json against the registry.
        run: pnpm install --no-frozen-lockfile
      - name: Restore pre-commit cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
          restore-keys: pre-commit-${{ runner.os }}-
      - name: Run pre-commit
        run: uvx pre-commit==4.6.0 run --all-files --show-diff-on-failure

  # Stable Required check: runs even when `pre-commit` is cancelled/skipped, so
  # a protected branch never gets stuck on a check that never reports.
  pre-commit-passed: # required-check: true
    if: always()
    needs: [pre-commit]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            .github/actions/report-job-result
            .github/scripts
          persist-credentials: false

      - name: Report result
        uses: ./.github/actions/report-job-result
        with:
          run: "true"
          decide-result: "success"
          result: ${{ needs.pre-commit.result }}
