# Auto-resolve a PR's merge conflicts with its base branch: an OPTIONAL
# deterministic generated-file pre-pass (`pnpm resolve-generated`, only when the
# repo defines that script) plus an LLM pass over the remaining SOURCE conflicts,
# one bounded model call per conflicted file, pushed back as a normal merge
# commit. Generated files whose sources also conflicted are excluded from the LLM
# prompt and regenerated once the sources are resolved; a conflict with no textual
# resolution (a `-merge`-attributed lockfile, a binary) fails the run with a PR
# comment BEFORE any LLM cost. Safety rails: same-repo PRs only (a fork's token is
# read-only and its author is untrusted), non-bot / non-draft authors, conflicts
# in protected paths (this repo's Claude config and CI machinery) are still
# resolved by the LLM but flagged for human review in the pushed-resolution
# comment, and the resolved head is re-validated by CI + human review before it
# can merge. The workflow comments on a PR only when it actually pushes something
# (or fails mid-resolution) — a run that ends up doing nothing says nothing. The
# merge commit is pushed with the workflow-capable TEMPLATE_SYNC_TOKEN (the only
# token GitHub allows to update workflow files, and a PAT so the push retriggers
# the PR's checks); if that secret is absent the PR is labeled
# `auto-resolve-blocked` and skipped until a human provisions the token and
# removes the label — otherwise every base push would re-run a paid resolve into
# the same rejection.
# It mutates the PR branch, so — like the pre-commit autofix — it is NOT a
# required check.
#
# Adopters turn it off with repository VARIABLES rather than by editing this
# file, which template-sync would hand back: AUTO_RESOLVE_DISABLED=true for the
# whole workflow, AUTO_RESOLVE_SCHEDULE_DISABLED=true for the backstop scan
# alone, AUTO_RESOLVE_SELF_REVIEW_DISABLED=true for the pre-push review. README's
# "Auto-resolving merge conflicts" section is the user-facing copy of this list.
#
# ── Trust model ───────────────────────────────────────────────────────────────
#
# TWO JOBS, and the split IS the security boundary. `resolve` checks out the PULL
# REQUEST'S OWN HEAD and runs things out of it — the `setup-base-env` local
# composite (a `uses: ./…` path resolves against the workspace, i.e. against the
# PR's copy), `pnpm resolve-generated` (the PR's own node code), and the model
# itself. `land` holds the push credential and runs none of that.
#
# The separation is load-bearing rather than tidy, because a single job leaks
# through every step-to-step channel the runner provides. Anything executing in
# `resolve` can append to $GITHUB_ENV — BASH_ENV=/tmp/x.sh makes the next `run:`
# step source attacker shell before its first line — or to $GITHUB_PATH, or plant
# a `git`/`gh` in a directory an earlier step published. So the unit of exposure
# is the JOB, not the step: staging the resolver scripts from the base ref stops
# a PR from rewriting the resolver's LOGIC, but it was never a boundary around
# the resolver's CREDENTIALS. No such channel crosses a job boundary.
#
# One artifact crosses — a git bundle of the merge commit, and nothing else.
# `land` treats it as UNTRUSTED: it replays the same merge itself in a tree the
# model never touched and requires the bundled commit to differ from that replay
# only in paths git's own merge left conflicted, with no markers, before it
# pushes. It transmits no manifest for `land` to believe, because every claim it
# could make is one `land` would have to re-derive anyway.
#
# Kept a SEPARATE file from the pull_request_target reviewers on purpose: this
# workflow checks out the PR HEAD (the resolve job) to merge into it, whereas the
# reviewers run under pull_request_target with base-only checkouts. Co-locating a
# head checkout with pull_request_target trips CodeQL's untrusted-checkout query,
# which is file-scoped and cannot see the per-job event gating — and it would
# blind that query to the secrets-bearing reviewer jobs. Splitting keeps the
# reviewers under full CodeQL coverage and this head-checkout resolver on its own
# unprivileged triggers.
#
# A conflict is created either by the PR branch moving (a pull_request event) or
# by the base branch moving underneath the PR (a push to main). The latter emits
# NO pull_request event, and does not re-fire the `labeled` event for a PR that
# already carries the merge-conflict label, so a push scan — re-checking every
# open PR the same way the merge-conflict labeler does — is the only trigger that
# reaches a conflict introduced from underneath the branch. The `discover` job
# turns whichever event fired into the set of eligible PRs; `resolve` fans out
# over them and `land` pushes what it produced.
#
# claude-code-action rejects `push` (and `schedule`) events outright
# ("Unsupported event type"), so such a run never resolves directly: when its
# scan finds conflicting PRs, the `relay` job re-fires this workflow as a
# workflow_dispatch (which the action does support) and THAT run re-discovers and
# resolves. GITHUB_TOKEN's recursion guard exempts workflow_dispatch, so the relay
# dispatch does start a run; the dispatched run can't relay again (relay fires
# only on push/schedule), so no loop.
#
# The scheduled scan closes the born-conflicted gap: a PR whose branch was cut
# from an older main conflicts the instant it opens, but the `opened` event may
# never drive a resolve — most sharply when the PR is opened via the API/app
# token, since GitHub suppresses workflow triggers for events a GITHUB_TOKEN /
# app actor generates (its own recursion guard). Such a PR then waits for the
# next push-to-main scan, which is arbitrarily far off. The schedule re-scans
# every open PR on a fixed cadence and relays exactly like the push scan, so a
# conflicting PR is picked up within the interval no matter which events reached
# (or skipped) it.
name: Auto-resolve merge conflicts

on:
  pull_request: # not-required-check — mutates the PR branch; never gate merges on it
    types: [opened, synchronize, reopened, labeled]
  # push-ungated: a push to main is what flips open PRs to CONFLICTING; re-scan
  # them all (the labeler fires on the same event for the same reason).
  push:
    branches: [main]
  # Backstop for born-conflicted PRs no push/label/opened event resolved in time
  # (see the header note). Runs discover across every open PR and relays like the
  # push scan. Every 5 minutes (GitHub's minimum cron granularity) — discover is a
  # cheap, deterministic scan (a few gh API calls, ~30s) that only fans out to the
  # paid resolve when it actually finds a conflicting PR, so a tight cadence just
  # shortens the born-conflicted wait without incurring LLM cost on empty scans.
  #
  # CADENCE IS ADOPTER-TUNABLE: this cron is the knob — a low-PR-volume repo can
  # slow it (e.g. "*/30 * * * *" or hourly). A repo that wants no scheduled
  # backstop at all sets the repository variable AUTO_RESOLVE_SCHEDULE_DISABLED=true
  # (the discover job's `if:` gates the schedule path on it) without editing YAML.
  schedule:
    - cron: "*/5 * * * *"
  # The push/schedule scan's resolve vehicle (see the relay note above); discover
  # re-scans every open PR, so the relay dispatch carries no inputs. `catch-up`
  # is for a HUMAN dispatch over a backlog: it drops both spend filters (the
  # commit-age window and the per-head attempt mark) for that one run, so PRs a
  # resolver defect stranded are picked up without waiting out the mark's TTL.
  workflow_dispatch:
    inputs:
      catch-up:
        description: "Ignore the commit-age window and per-head attempt marks for this run"
        type: boolean
        default: false

permissions: {}

# WHERE THE RESOLVER COMES FROM, named once for both jobs that need it. `discover`
# clones it below; `resolve` passes the same pair to the reusable workflow, which
# cannot read these (a `with:` value may not reference `env`), so the two literals
# there must match these. A consumer repository points both at this repository and
# pins `ref` to the SHA its `uses:` line names, so the workflow and the scripts it
# runs come from one commit.
env:
  RESOLVER_REPOSITORY: AlexanderMattTurner/claude-automation-template
  RESOLVER_REF: main

jobs:
  discover:
    name: Discover PRs to auto-resolve
    # The master switch and the scheduled backstop are both opt-out via a
    # repository variable (cadence knob lives on the cron above), so an adopting
    # repo turns the resolver off without editing this file and having the next
    # template sync hand the edit back. On a `labeled` event, only the
    # merge-conflict label is relevant; every other event enters and the
    # discover script decides eligibility per PR.
    if: >-
      vars.AUTO_RESOLVE_DISABLED != 'true' &&
      (github.event_name != 'schedule' || vars.AUTO_RESOLVE_SCHEDULE_DISABLED != 'true') &&
      (github.event_name != 'pull_request' ||
      github.event.action != 'labeled' ||
      github.event.label.name == 'merge-conflict')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
      statuses: read # the per-head attempt mark is a commit status
    outputs:
      prs: ${{ steps.discover.outputs.prs }}
    steps:
      # NO checkout of this repository. discover reads GitHub, never the tree, and
      # a pull_request event checks out the MERGE REF by default — the PR-authored
      # copy of the script whose `prs` output drives the write-token resolve job.
      # Cloning the resolver instead removes that substitution entirely: the code
      # comes from a repository the pull request cannot write, on every event.
      - name: Check out the resolver from its own repository
        id: resolver
        run: |
          dest="${RUNNER_TEMP}/resolver"
          git clone --no-tags "https://github.com/${RESOLVER_REPOSITORY}.git" "${dest}"
          git -C "${dest}" checkout --detach "${RESOLVER_REF}"
          echo "dir=${dest}/.github/resolver" >>"$GITHUB_OUTPUT"

      - name: Discover conflicting PRs
        id: discover
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          # Present on a pull_request event → the script considers that one PR;
          # empty on push → it scans every open PR.
          PR_NUMBER: ${{ github.event.pull_request.number }}
          # A human catch-up dispatch drops both spend filters for this one run;
          # empty values keep the script's own defaults on every other trigger.
          AUTO_RESOLVE_MAX_COMMIT_AGE_HOURS: ${{ inputs.catch-up && '0' || vars.AUTO_RESOLVE_MAX_COMMIT_AGE_HOURS }}
          AUTO_RESOLVE_IGNORE_ATTEMPT_MARK: ${{ inputs.catch-up && 'true' || 'false' }}
          # Unset repository variables arrive empty, and every script defaults an
          # empty value — so an adopter tunes these without editing this file.
          AUTO_RESOLVE_ATTEMPT_TTL_HOURS: ${{ vars.AUTO_RESOLVE_ATTEMPT_TTL_HOURS }}
          # Which repository and ref hold the resolver, so the handoff-mark probe
          # asks THAT repository when the resolver's own code last changed rather
          # than scanning a tree that no longer carries it.
          AUTO_RESOLVE_RESOLVER_REPO: ${{ env.RESOLVER_REPOSITORY }}
          AUTO_RESOLVE_RESOLVER_REF: ${{ env.RESOLVER_REF }}
        # No bootstrap guard: the script comes from the resolver clone above, so an
        # absent one is a bad RESOLVER_REF and fails loud instead of quietly
        # reporting an empty set.
        run: python3 "${{ steps.resolver.outputs.dir }}/auto-resolve/discover.py"

  relay:
    name: Relay push/schedule scan as workflow_dispatch
    needs: discover
    # Both the push and the scheduled scan run under an event claude-code-action
    # rejects, so both resolve indirectly by re-dispatching. Keep this off
    # workflow_dispatch itself so the relayed run can't relay again (no loop).
    if: >-
      (github.event_name == 'push' || github.event_name == 'schedule') &&
      needs.discover.outputs.prs != '' && needs.discover.outputs.prs != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Re-dispatch this workflow
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow run auto-resolve-conflicts.yaml --ref "${GITHUB_REF_NAME}"

  resolve:
    name: Auto-resolve merge conflicts
    needs: discover
    # push and schedule run relay instead of resolving (claude-code-action rejects
    # both); resolve happens on the relayed workflow_dispatch (and directly on a
    # pull_request event).
    if: >-
      github.event_name != 'push' && github.event_name != 'schedule' &&
      needs.discover.outputs.prs != '' && needs.discover.outputs.prs != '[]'
    strategy:
      fail-fast: false
      # Serialize the fan-out: each PR gets its own push, and the shared LLM/token
      # budget makes parallel resolves more contention than speed is worth.
      max-parallel: 1
      matrix:
        pr: ${{ fromJSON(needs.discover.outputs.prs) }}
    # The resolver itself, its two-job privilege split, its permissions and its
    # concurrency all live in the reusable workflow — this file only says WHICH
    # pull requests to hand it and what this repository can do.
    #
    # A local `./` reference resolves against this repository's own ref, which is
    # correct here because the resolver lives here too. A CONSUMER repository
    # names it as `AlexanderMattTurner/claude-automation-template/.github/workflows/
    # auto-resolve-reusable.yaml@<sha>` and passes that same sha as `resolver-ref`,
    # so the workflow and the scripts it runs come from one commit.
    uses: ./.github/workflows/auto-resolve-reusable.yaml
    with:
      pr: ${{ matrix.pr.number }}
      # The literals from this file's `env:` block, repeated because a reusable
      # workflow's `with:` cannot read `env`. Change both together.
      resolver-repository: AlexanderMattTurner/claude-automation-template
      resolver-ref: main
      # This repository ships no scripts/lib_marked_region.py and no derived-file
      # resolver, so the generated-region pre-pass and the deterministic pre-pass
      # both stay off: every conflict reaches the model whole. A consumer that has
      # them passes `marked-regions: true`, `resolver-mjs` and `pre-pass-command`.
      #
      # `log-redactor` is likewise unset, which publishes NO fan-out logs. That is
      # the fail-closed default: an agent transcript carries whatever the merge
      # exposed it to, so a repository with no redactor uploads nothing.
      protected-paths-regex: "^(\\.github/|\\.claude/|\\.hooks/)"
    secrets: inherit

