name: CI failure notify

# Post-merge (push-to-main) and scheduled workflow failures emit no PR webhook,
# so they rot unnoticed — releases have silently stopped for weeks downstream.
# This workflow converts such a failure into an open issue (label: ci-failure),
# deduplicated per workflow name: repeat failures comment on the existing issue.
# The same workflow's next success on the default branch closes that issue, so
# an open one means the failure is still live.
#
# `workflow_run` has no wildcard, so `workflows:` below must name every
# workflow in this repo with a `push:` or `schedule:` trigger (matched by the
# workflow's `name:`). A ci-truth-serum hook (check-failure-notifier-coverage)
# keeps this list in sync with the tree. Binding is by NAME, not filename: a
# repo that keeps its own release workflow instead of the template's
# auto-version.yaml must give it the name listed here or add its own.
# The dangerous-triggers finding targets workflows that check out or execute
# the triggering ref's code with write credentials; this one checks out only
# the default branch (credential-less) and gates on default-branch runs.
on: # zizmor: ignore[dangerous-triggers]
  workflow_run:
    types: [completed]
    workflows:
      - Auto-resolve merge conflicts
      - Auto version bump and publish
      - CI failure-rate report
      - Claude reviewer-hold sweeper
      - Format check
      - Gitleaks Secret Scanning
      - Hook lifecycle
      - Lint
      - Node tests
      - PR meta (privileged)
      - pre-commit
      - Release canary
      - Weekly Security & Dependency Remediation
      - Sync required status checks
      - Sync from Template
      - Validate config
      - zizmor
    # This notifier only acts on a push/schedule run of the default branch
    # (see the job's own `if:` below); narrowing the trigger itself
    # stops a PR-branch completion of a shared workflow (pre-commit, zizmor,
    # …) from creating a run that the `if:` would only then discard.
    branches: [main, master]

concurrency:
  # Keyed per triggering workflow so failures of different workflows never
  # queue behind each other; never cancel — a dropped notification defeats
  # the whole point.
  group: ${{ github.workflow }}-${{ github.event.workflow_run.name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  notify:
    name: File, update, or close ci-failure issue
    # PR-triggered failures are already visible on the PR; only failures of
    # push/schedule runs on the default branch go unnoticed. `success` reaches
    # the script too, to close the issue a past failure opened.
    if: >-
      contains(fromJSON('["action_required", "failure", "startup_failure", "timed_out", "success"]'), github.event.workflow_run.conclusion) &&
      (github.event.workflow_run.event == 'push' ||
       github.event.workflow_run.event == 'schedule') &&
      github.event.workflow_run.head_branch == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
      # Reading the triggering run's jobs is what tells a verified green from a
      # run that concluded success with its work job skipped.
      actions: read
    steps:
      # workflow_run workflows always execute from the default branch, so a
      # plain checkout fetches exactly the code that was vetted on main.
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          sparse-checkout: .github/scripts
          persist-credentials: false

      - name: File or update tracking issue
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const run = require('./.github/scripts/ci-failure-notify.js')
            await run({github, context, core})
